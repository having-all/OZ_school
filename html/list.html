<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- list: 여러 개의 데이터를 출력 -->
    <!-- ul: Unordered List -->
    내가 사용하는 프로그래밍 언어
     <ul>
        <!-- li: List Item -->
        <li>Python</li>
        <li>HTML</li>
        <li>CSS</li>
     </ul>
     <hr>
     <!-- ol: Ordered List(type으로 태그의 속성 부여) -->
     <!-- 속성(Attribute) 2개이상 사용가능: type, start-->
      <ol start="-1">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
      </ol>
</body>
</html>

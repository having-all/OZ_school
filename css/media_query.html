<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
        }

        /*조건 -> css :특정 조건에서만 반응 */
        /* 화면 너비가 300px 이하일 때 */
        @media (max-width: 300px)
        
        .container {
            flex-direction: column;
    
        }
        .box {
            background-color: skyblue;
            border: 1px solid black;
            flex: 1;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">홈</div>
        <div class="box">공지사항</div>
        <div class="box">게시판</div>
        <div class="box">갤러리</div>
        <div class="box">내 정보</div>
    </div>
    
</body>
</html>

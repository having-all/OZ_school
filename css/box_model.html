<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            /* 콘텐츠: 기본 높이는 테스트의 크기에 할당됨 */
            background-color: orange;
            
            /* 테두리 */
            border: 2px solid black;

            /* padding: 테두리에서 여백이 생김 
            기본 상하좌우 적용 but top, bottom, left, right로 지정 가능*/
            /*padding: 10px; */

            /* margin */
            margin: 20px;
        }

        .box2 {
            margin-top: 10px;
            background-color: orange;
            border: 2px solid black;

        }
    </style>
</head>
<body>
    <div class="box">BOX</div>
    <div class="box2">BOX2</div>
</body>
</html>

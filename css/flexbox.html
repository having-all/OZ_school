<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            

        }

        .container {
            /*flex 박스를 기본 가로, 세로 지정 가능 */
            height: 200px;
            background-color: orange;
            display: flex;
            flex-direction: row;

            /* 주축 방향 정렬 */
            justify-content: end;

            /* 교차축 방향으로 정렬 */
            align-items: center;  
        }

        .item {
            text-align: center;
            background-color: skyblue;
            border: 1px solid black;
        
            width: 50px;

            /* flex box: 하나의 단위로 묶는 것- 부모클래스에 속성 부여 */

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
